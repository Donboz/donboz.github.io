<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resim</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column; /* Öğeleri yan yana değil, alt alta dizmesi için eklendi */
            justify-content: center;
            align-items: center;
            background-color: #121212; 
        }

        img {
            width: 450px; 
            max-width: 90vw; 
            height: auto;
        }

        /* Eklediğimiz paragraf (p) etiketi için ayarlar */
        p {
            color: white; /* Yazıyı beyaz yapar */
            font-size: 28px; /* Yazı boyutu */
            font-family: sans-serif; /* Daha düz ve şık bir yazı tipi */
            margin-top: 20px; /* Resim ile arasına biraz boşluk bırakır */
            text-align: center; /* Yazıyı tam ortalar */
            font-weight: bold; /* Yazıyı kalın yapar (isteğe bağlı) */
        }
    </style>
</head>
<body>

    <img src="imgs/s-l400.jpg" alt="SEXXXXX">
    <p> Özcan Bey </p>

</body>
</html>
