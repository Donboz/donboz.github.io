<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resim</title>
    <style>
        /* Sayfanın kenar boşluklarını sıfırlayıp tam ekran yapıyoruz */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212; /* Göz yormaması için koyu bir arka plan */
        }

        /* Resmi biraz büyük ve ekranı taşırmayacak şekilde ayarlıyoruz */
        img {
            width: 450px; /* İstediğin gibi biraz büyük */
            max-width: 90vw; /* Mobilde veya küçük ekranda taşmayı engeller */
            height: auto;
        }

        p {
            color: white; /* Yazıyı beyaz yapar */
            font-size: 28px; /* Yazı boyutu */
            font-family: sans-serif; /* Daha düz ve şık bir yazı tipi */
            margin-top: 20px; /* Resim ile arasına biraz boşluk bırakır */
            text-align: center; /* Yazıyı tam ortalar */
            font-weight: bold; /* Yazıyı kalın yapar (isteğe bağlı) */
        }
    </style>
</head>
<body>

    <img src="imgs/s-l400.jpg" alt="SEXXXXX">
    <p> Özcan Bey </p>

</body>
</html>
