<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kıyafet Önizleyici — Donboz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-wrapper {
            min-height: 100vh;
            padding: 6rem 5% 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-title { font-size: 2.2rem; margin-bottom: 0.4rem; text-align: center; }
        .page-subtitle { color: var(--text-secondary); margin-bottom: 2.5rem; text-align: center; font-size: 0.98rem; max-width: 520px; }

        .back-link {
            color: var(--text-secondary); text-decoration: none; font-size: 0.88rem;
            display: inline-flex; align-items: center; gap: 0.4rem;
            margin-bottom: 1.8rem; transition: color 0.3s;
        }
        .back-link:hover { color: var(--accent); }

        /* Main layout */
        .main-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 980px;
            align-items: start;
        }

        /* Controls panel */
        .controls-panel {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 20px;
            padding: 1.6rem;
            display: flex; flex-direction: column; gap: 1.4rem;
        }
        .controls-panel h3 { font-size: 0.95rem; color: var(--accent); margin-bottom: 0.2rem; }

        .form-label { font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 0.4rem; }

        select, input[type="range"] {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            outline: none;
            width: 100%;
        }
        select option { background: #1a1a24; }

        .color-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .color-swatch {
            width: 32px; height: 32px; border-radius: 8px;
            cursor: pointer; border: 2px solid transparent;
            transition: 0.2s; flex-shrink: 0;
        }
        .color-swatch.active, .color-swatch:hover { border-color: #fff; transform: scale(1.15); }

        .custom-color-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.4rem; }
        .custom-color-row input[type="color"] {
            width: 40px; height: 32px; padding: 2px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2); background: transparent;
            cursor: pointer; flex-shrink: 0;
        }
        .custom-color-row span { font-size: 0.8rem; color: var(--text-secondary); }

        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            color: var(--text-secondary);
            font-size: 0.82rem;
            position: relative;
        }
        .upload-zone:hover { border-color: var(--accent); color: var(--accent); }
        .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
        .upload-zone .thumb { max-width: 60px; max-height: 60px; border-radius: 6px; border: 1px solid var(--accent); margin: 0.4rem auto 0; display: none; }

        .slider-row { display: flex; align-items: center; gap: 0.8rem; }
        .slider-row input[type="range"] { padding: 0; border: none; background: transparent; flex: 1; accent-color: var(--accent); }
        .slider-row span { font-size: 0.8rem; color: var(--accent); font-weight: 600; min-width: 34px; text-align: right; }

        .btn-reset {
            background: transparent; border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-secondary); border-radius: 8px;
            padding: 0.6rem 1rem; font-size: 0.82rem; cursor: pointer;
            transition: 0.3s; width: 100%; font-family: 'Poppins', sans-serif;
        }
        .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.07); }

        /* Viewer panel */
        .viewer-panel {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 20px;
            padding: 2rem;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }

        /* 3D scene */
        .scene {
            perspective: 900px;
            width: 320px; height: 380px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }
        .scene:active { cursor: grabbing; }

        .card {
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.06s ease-out;
            position: relative;
        }

        .face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .face-back { transform: rotateY(180deg); }

        .face canvas { display: block; width: 100%; height: 100%; }

        .viewer-hint {
            font-size: 0.78rem; color: var(--text-secondary);
            display: flex; align-items: center; gap: 0.4rem;
        }

        .face-badge {
            font-size: 0.78rem; color: var(--accent);
            font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
        }

        @media (max-width: 860px) {
            .main-layout { grid-template-columns: 1fr; }
            .scene { width: 280px; height: 330px; }
        }
        @media (max-width: 480px) {
            .scene { width: 240px; height: 285px; }
            .controls-panel { padding: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="bg-animation"></div>

<header>
    <a href="index.html" class="logo"><span class="gradient-text">Donboz</span></a>
    <nav class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link">Ana Sayfa</a>
    </nav>
    <div class="menu-toggle" id="menuToggle">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </div>
</header>

<div class="page-wrapper">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Araçlara Dön</a>
    <h1 class="page-title"><span class="gradient-text">3D Kıyafet</span> Önizleyici</h1>
    <p class="page-subtitle">Logonu yükle, kıyafet tipini ve rengini seç. Sürükleyerek 3D olarak döndür.</p>

    <div class="main-layout">
        <!-- Controls -->
        <div class="controls-panel">
            <h3><i class="fa-solid fa-shirt"></i> Kıyafet</h3>
            <div>
                <label class="form-label" for="clothingType">Tür</label>
                <select id="clothingType">
                    <option value="tshirt">Tişört</option>
                    <option value="hoodie">Hoodie / Kapüşonlu</option>
                    <option value="sweatshirt">Sweatshirt</option>
                </select>
            </div>

            <hr class="divider">
            <h3><i class="fa-solid fa-palette"></i> Renk</h3>
            <div class="color-row" id="colorSwatches">
                <!-- filled by JS -->
            </div>
            <div class="custom-color-row">
                <input type="color" id="customColor" value="#1a1a2e" title="Özel renk seç">
                <span>Özel renk</span>
            </div>

            <hr class="divider">
            <h3><i class="fa-solid fa-image"></i> Logo</h3>
            <div class="upload-zone" id="logoZone">
                <input type="file" id="logoInput" accept="image/*">
                <i class="fa-solid fa-upload" style="font-size:1.2rem;display:block;margin-bottom:0.3rem;"></i>
                <span id="logoZoneLabel">Logo yüklemek için tıkla</span>
                <img id="logoThumb" class="thumb" alt="Logo">
            </div>

            <div>
                <label class="form-label">Logo Boyutu</label>
                <div class="slider-row">
                    <input type="range" id="logoScale" min="10" max="80" value="35">
                    <span id="logoScaleVal">35%</span>
                </div>
            </div>

            <div>
                <label class="form-label">Dikey Konum</label>
                <div class="slider-row">
                    <input type="range" id="logoPosY" min="-30" max="30" value="0">
                    <span id="logoPosYVal">0</span>
                </div>
            </div>

            <button class="btn-reset" id="resetBtn"><i class="fa-solid fa-rotate-left"></i> Sıfırla</button>
        </div>

        <!-- Viewer -->
        <div class="viewer-panel">
            <p class="face-badge" id="faceBadge">Ön Yüz</p>
            <div class="scene" id="scene">
                <div class="card" id="card">
                    <div class="face face-front">
                        <canvas id="frontCanvas" width="320" height="380"></canvas>
                    </div>
                    <div class="face face-back">
                        <canvas id="backCanvas" width="320" height="380"></canvas>
                    </div>
                </div>
            </div>
            <p class="viewer-hint"><i class="fa-solid fa-hand-pointer"></i> Sürükleyerek döndür &nbsp;|&nbsp; <i class="fa-solid fa-hand"></i> Dikey eğilt</p>
        </div>
    </div>
</div>

<script>
// ── Hamburger ───────────────────────────────────────
document.getElementById('menuToggle').addEventListener('click', () => {
    document.getElementById('menuToggle').classList.toggle('active');
    document.getElementById('navMenu').classList.toggle('active');
});

// ── State ───────────────────────────────────────────
let shirtColor  = '#1a1a2e';
let logoImg     = null;
let logoScale   = 0.35;
let logoPosY    = 0;
let clothingType = 'tshirt';

let rotY = 0, rotX = 0;
let isDragging = false;
let lastX = 0, lastY = 0;

// ── Color swatches ──────────────────────────────────
const COLORS = [
    '#1a1a2e', '#ffffff', '#2e2e2e', '#000000',
    '#e63946', '#457b9d', '#2a9d8f', '#e9c46a',
    '#f4a261', '#264653', '#6a0572', '#023e8a'
];

const swatchesEl = document.getElementById('colorSwatches');
COLORS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'color-swatch' + (c === shirtColor ? ' active' : '');
    s.style.background = c;
    s.title = c;
    s.addEventListener('click', () => {
        shirtColor = c;
        document.getElementById('customColor').value = c;
        document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
        s.classList.add('active');
        redraw();
    });
    swatchesEl.appendChild(s);
});

document.getElementById('customColor').addEventListener('input', (e) => {
    shirtColor = e.target.value;
    document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
    redraw();
});

// ── Clothing type ───────────────────────────────────
document.getElementById('clothingType').addEventListener('change', (e) => {
    clothingType = e.target.value;
    redraw();
});

// ── Logo upload ─────────────────────────────────────
document.getElementById('logoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
            logoImg = img;
            document.getElementById('logoThumb').src = ev.target.result;
            document.getElementById('logoThumb').style.display = 'block';
            document.getElementById('logoZoneLabel').textContent = file.name;
            redraw();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

// ── Sliders ─────────────────────────────────────────
document.getElementById('logoScale').addEventListener('input', (e) => {
    logoScale = parseInt(e.target.value) / 100;
    document.getElementById('logoScaleVal').textContent = e.target.value + '%';
    redraw();
});
document.getElementById('logoPosY').addEventListener('input', (e) => {
    logoPosY = parseInt(e.target.value);
    document.getElementById('logoPosYVal').textContent = e.target.value;
    redraw();
});

// ── Reset ───────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', () => {
    rotY = 0; rotX = 0;
    document.getElementById('card').style.transform = 'rotateY(0deg) rotateX(0deg)';
    updateFaceBadge();
});

// ══════════════════════════════════════════════════
// DRAWING
// ══════════════════════════════════════════════════
const W = 320, H = 380;

// T-shirt path points (normalized 0–1)
const PATHS = {
    tshirt: {
        front: (ctx, w, h) => {
            ctx.beginPath();
            ctx.moveTo(0.17*w, 0);
            ctx.lineTo(0.35*w, 0);
            ctx.lineTo(0.35*w, 0.07*h);
            ctx.quadraticCurveTo(0.50*w, 0.13*h, 0.65*w, 0.07*h);
            ctx.lineTo(0.65*w, 0);
            ctx.lineTo(0.83*w, 0);
            ctx.lineTo(w,      0.19*h);
            ctx.lineTo(0.78*w, 0.23*h);
            ctx.lineTo(0.78*w, h);
            ctx.lineTo(0.22*w, h);
            ctx.lineTo(0.22*w, 0.23*h);
            ctx.lineTo(0,      0.19*h);
            ctx.closePath();
        },
        back: (ctx, w, h) => {
            ctx.beginPath();
            ctx.moveTo(0.17*w, 0);
            ctx.lineTo(0.83*w, 0);
            ctx.lineTo(w,      0.19*h);
            ctx.lineTo(0.78*w, 0.23*h);
            ctx.lineTo(0.78*w, h);
            ctx.lineTo(0.22*w, h);
            ctx.lineTo(0.22*w, 0.23*h);
            ctx.lineTo(0,      0.19*h);
            ctx.closePath();
        }
    },
    sweatshirt: {
        front: (ctx, w, h) => {
            // wider body, ribbed hem
            ctx.beginPath();
            ctx.moveTo(0.14*w, 0);
            ctx.lineTo(0.34*w, 0);
            ctx.lineTo(0.34*w, 0.07*h);
            ctx.quadraticCurveTo(0.50*w, 0.12*h, 0.66*w, 0.07*h);
            ctx.lineTo(0.66*w, 0);
            ctx.lineTo(0.86*w, 0);
            ctx.lineTo(w,      0.18*h);
            ctx.lineTo(0.80*w, 0.23*h);
            ctx.lineTo(0.80*w, 0.92*h);
            ctx.lineTo(0.20*w, 0.92*h);
            ctx.lineTo(0.20*w, 0.23*h);
            ctx.lineTo(0,      0.18*h);
            ctx.closePath();
        },
        back: (ctx, w, h) => {
            ctx.beginPath();
            ctx.moveTo(0.14*w, 0);
            ctx.lineTo(0.86*w, 0);
            ctx.lineTo(w,      0.18*h);
            ctx.lineTo(0.80*w, 0.23*h);
            ctx.lineTo(0.80*w, 0.92*h);
            ctx.lineTo(0.20*w, 0.92*h);
            ctx.lineTo(0.20*w, 0.23*h);
            ctx.lineTo(0,      0.18*h);
            ctx.closePath();
        }
    },
    hoodie: {
        front: (ctx, w, h) => {
            // body (same as sweatshirt but with hood at top)
            ctx.beginPath();
            ctx.moveTo(0.14*w, 0.12*h);  // hood base left
            ctx.lineTo(0.86*w, 0.12*h);  // hood base right
            ctx.lineTo(w,      0.26*h);  // sleeve right
            ctx.lineTo(0.80*w, 0.32*h);  // armhole right
            ctx.lineTo(0.80*w, 0.92*h);  // hem right
            ctx.lineTo(0.20*w, 0.92*h);  // hem left
            ctx.lineTo(0.20*w, 0.32*h);  // armhole left
            ctx.lineTo(0,      0.26*h);  // sleeve left
            ctx.closePath();
        },
        back: (ctx, w, h) => {
            ctx.beginPath();
            ctx.moveTo(0.14*w, 0.12*h);
            ctx.lineTo(0.86*w, 0.12*h);
            ctx.lineTo(w,      0.26*h);
            ctx.lineTo(0.80*w, 0.32*h);
            ctx.lineTo(0.80*w, 0.92*h);
            ctx.lineTo(0.20*w, 0.92*h);
            ctx.lineTo(0.20*w, 0.32*h);
            ctx.lineTo(0,      0.26*h);
            ctx.closePath();
        }
    }
};

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return { r, g, b };
}

function shadeColor(hex, factor) {
    // factor < 1 = darker, > 1 = lighter
    const {r,g,b} = hexToRgb(hex);
    const clamp = v => Math.min(255, Math.max(0, Math.round(v)));
    return `rgb(${clamp(r*factor)},${clamp(g*factor)},${clamp(b*factor)})`;
}

function drawShirt(canvas, isFront) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const pathDef = PATHS[clothingType];
    const pathFn  = isFront ? pathDef.front : pathDef.back;

    // --- Base fill ---
    pathFn(ctx, w, h);
    ctx.fillStyle = shirtColor;
    ctx.fill();

    // --- Subtle left-shadow gradient for depth ---
    pathFn(ctx, w, h);
    const shadGrad = ctx.createLinearGradient(0, 0, w * 0.4, 0);
    shadGrad.addColorStop(0, 'rgba(0,0,0,0.18)');
    shadGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadGrad;
    ctx.fill();

    // --- Right highlight ---
    pathFn(ctx, w, h);
    const hiGrad = ctx.createLinearGradient(w * 0.6, 0, w, 0);
    hiGrad.addColorStop(0, 'rgba(0,0,0,0)');
    hiGrad.addColorStop(1, 'rgba(0,0,0,0.12)');
    ctx.fillStyle = hiGrad;
    ctx.fill();

    // --- Top highlight stripe ---
    pathFn(ctx, w, h);
    const topHi = ctx.createLinearGradient(0, 0, 0, h * 0.3);
    topHi.addColorStop(0, 'rgba(255,255,255,0.10)');
    topHi.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = topHi;
    ctx.fill();

    // --- Stroke (outline) ---
    pathFn(ctx, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // --- Hoodie hood ---
    if (clothingType === 'hoodie' && isFront) {
        drawHoodFront(ctx, w, h);
    }
    if (clothingType === 'hoodie' && !isFront) {
        drawHoodBack(ctx, w, h);
    }

    // --- Sweatshirt / hoodie rib hem ---
    if (clothingType !== 'tshirt') {
        drawRibHem(ctx, w, h);
    }

    // --- Logo (front only) ---
    if (isFront && logoImg) {
        drawLogo(ctx, w, h);
    }

    // --- Seam lines for realism ---
    drawSeams(ctx, w, h, isFront);
}

function drawHoodFront(ctx, w, h) {
    const {r,g,b} = hexToRgb(shirtColor);
    const lighterColor = `rgb(${Math.min(255,r+20)},${Math.min(255,g+20)},${Math.min(255,b+20)})`;

    // Hood shape (two arcs meeting at top)
    ctx.beginPath();
    ctx.moveTo(0.14*w, 0.12*h);
    ctx.lineTo(0.27*w, 0.12*h);
    ctx.quadraticCurveTo(0.22*w, 0, 0.36*w, 0);
    ctx.lineTo(0.64*w, 0);
    ctx.quadraticCurveTo(0.78*w, 0, 0.73*w, 0.12*h);
    ctx.lineTo(0.86*w, 0.12*h);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Hood fill
    ctx.beginPath();
    ctx.moveTo(0.27*w, 0.12*h);
    ctx.quadraticCurveTo(0.22*w, 0, 0.36*w, 0);
    ctx.lineTo(0.64*w, 0);
    ctx.quadraticCurveTo(0.78*w, 0, 0.73*w, 0.12*h);
    ctx.lineTo(0.27*w, 0.12*h);
    ctx.fillStyle = lighterColor;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Kangaroo pocket
    ctx.beginPath();
    ctx.roundRect(0.33*w, 0.62*h, 0.34*w, 0.14*h, 6);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.07)';
    ctx.fill();

    // Drawstring
    ctx.beginPath();
    ctx.moveTo(0.42*w, 0.12*h);
    ctx.lineTo(0.45*w, 0.36*h);
    ctx.moveTo(0.58*w, 0.12*h);
    ctx.lineTo(0.55*w, 0.36*h);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

function drawHoodBack(ctx, w, h) {
    ctx.beginPath();
    ctx.moveTo(0.14*w, 0.12*h);
    ctx.quadraticCurveTo(0.50*w, -0.05*h, 0.86*w, 0.12*h);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

function drawRibHem(ctx, w, h) {
    const ribTop = 0.92 * h;
    const ribBot = h;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0.20*w, ribTop, 0.60*w, ribBot - ribTop);
    ctx.clip();
    for (let y = ribTop; y < ribBot; y += 3) {
        ctx.beginPath();
        ctx.moveTo(0.20*w, y);
        ctx.lineTo(0.80*w, y);
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    ctx.restore();
}

function drawSeams(ctx, w, h, isFront) {
    ctx.save();
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;

    if (isFront) {
        // shoulder seams
        ctx.beginPath();
        ctx.moveTo(0.22*w, 0.23*h);
        ctx.lineTo(0.35*w, 0.07*h);
        ctx.moveTo(0.78*w, 0.23*h);
        ctx.lineTo(0.65*w, 0.07*h);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();
}

function drawLogo(ctx, w, h) {
    const maxW   = w * 0.56 * logoScale;
    const aspect = logoImg.width / logoImg.height;
    const lw     = maxW;
    const lh     = lw / aspect;

    // Center horizontally, put on chest area (~38% from top)
    const startY = clothingType === 'hoodie' ? 0.35 : 0.28;
    const lx = (w - lw) / 2;
    const ly = h * startY + logoPosY * (h * 0.01);

    // Clip to shirt shape so logo doesn't overflow
    const pathFn = PATHS[clothingType].front;
    ctx.save();
    pathFn(ctx, w, h);
    ctx.clip();
    ctx.drawImage(logoImg, lx, ly, lw, lh);
    ctx.restore();
}

function redraw() {
    drawShirt(document.getElementById('frontCanvas'), true);
    drawShirt(document.getElementById('backCanvas'), false);
}

redraw();

// ══════════════════════════════════════════════════
// 3D DRAG ROTATION
// ══════════════════════════════════════════════════
const scene = document.getElementById('scene');
const card  = document.getElementById('card');

function applyTransform() {
    card.style.transform = `rotateY(${rotY}deg) rotateX(${rotX}deg)`;
    updateFaceBadge();
}

function updateFaceBadge() {
    const norm = ((rotY % 360) + 360) % 360;
    const isFront = norm < 90 || norm >= 270;
    document.getElementById('faceBadge').textContent = isFront ? 'Ön Yüz' : 'Arka Yüz';
}

// Mouse
scene.addEventListener('mousedown', (e) => {
    isDragging = true; lastX = e.clientX; lastY = e.clientY; e.preventDefault();
});
document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    rotY += (e.clientX - lastX) * 0.45;
    rotX -= (e.clientY - lastY) * 0.3;
    rotX  = Math.max(-40, Math.min(40, rotX));
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
});
document.addEventListener('mouseup', () => { isDragging = false; });

// Touch
scene.addEventListener('touchstart', (e) => {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    rotY += (e.touches[0].clientX - lastX) * 0.45;
    rotX -= (e.touches[0].clientY - lastY) * 0.3;
    rotX  = Math.max(-40, Math.min(40, rotX));
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    applyTransform();
}, { passive: true });
document.addEventListener('touchend', () => { isDragging = false; });
</script>
