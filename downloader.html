<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video İndirici — Donboz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-wrapper {
            min-height: 100vh;
            padding: 6rem 5% 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-title { font-size: 2.2rem; margin-bottom: 0.4rem; text-align: center; }
        .page-subtitle { color: var(--text-secondary); margin-bottom: 2.5rem; text-align: center; font-size: 1rem; max-width: 560px; }

        .tool-box {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }

        .url-row {
            display: flex; gap: 0.6rem;
        }
        .url-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .url-input:focus { border-color: var(--accent); }
        .url-input::placeholder { color: var(--text-secondary); opacity: 0.6; }

        select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.3s;
            width: 100%;
        }
        select:focus { border-color: var(--accent); }
        select option { background: #1a1a24; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .btn-primary {
            background: var(--accent); color: #000;
            border: none; border-radius: 12px;
            padding: 0.9rem 2rem; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-primary:hover { background: #fff; box-shadow: 0 0 20px var(--accent-glow); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .divider { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 0; }

        /* Result / Status */
        .result-area { display: none; flex-direction: column; gap: 1rem; }
        .result-area.show { display: flex; }

        .status-msg {
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .status-msg.loading { background: rgba(2,255,35,0.08); color: var(--accent); border: 1px solid rgba(2,255,35,0.2); }
        .status-msg.error   { background: rgba(255,80,80,0.08); color: #ff6b6b;      border: 1px solid rgba(255,80,80,0.2); }

        .download-option {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 0.9rem 1.2rem;
            transition: 0.2s;
        }
        .download-option:hover { border-color: var(--accent); }
        .download-option .info { display: flex; flex-direction: column; gap: 0.15rem; }
        .download-option .label { font-size: 0.88rem; font-weight: 600; }
        .download-option .sublabel { font-size: 0.78rem; color: var(--text-secondary); }

        .btn-dl {
            background: var(--accent); color: #000;
            border: none; border-radius: 8px;
            padding: 0.5rem 1.1rem; font-size: 0.82rem; font-weight: 700;
            cursor: pointer; transition: 0.3s; white-space: nowrap;
            display: flex; align-items: center; gap: 0.35rem;
        }
        .btn-dl:hover { background: #fff; }

        /* Supported platforms */
        .platforms {
            display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center;
            margin-top: 0.5rem;
        }
        .platform-chip {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 0.3rem 0.8rem; font-size: 0.78rem; color: var(--text-secondary);
        }

        .back-link {
            color: var(--text-secondary); text-decoration: none;
            font-size: 0.88rem; display: flex; align-items: center;
            gap: 0.4rem; margin-bottom: 1.8rem; transition: color 0.3s;
        }
        .back-link:hover { color: var(--accent); }

        .notice {
            font-size: 0.78rem; color: var(--text-secondary);
            text-align: center; opacity: 0.7;
        }

        @media (max-width: 600px) {
            .two-col { grid-template-columns: 1fr; }
            .tool-box { padding: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="bg-animation"></div>

<header>
    <a href="index.html" class="logo"><span class="gradient-text">Donboz</span></a>
    <nav class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link">Ana Sayfa</a>
    </nav>
    <div class="menu-toggle" id="menuToggle">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </div>
</header>

<div class="page-wrapper">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Araçlara Dön</a>
    <h1 class="page-title"><span class="gradient-text">Video</span> İndirici</h1>
    <p class="page-subtitle">YouTube, Instagram, TikTok ve daha fazlasından video veya ses indir.</p>

    <!-- Platform chips -->
    <div class="platforms" style="margin-bottom:2rem;">
        <span class="platform-chip"><i class="fa-brands fa-youtube"></i> YouTube</span>
        <span class="platform-chip"><i class="fa-brands fa-instagram"></i> Instagram</span>
        <span class="platform-chip"><i class="fa-brands fa-tiktok"></i> TikTok</span>
        <span class="platform-chip"><i class="fa-brands fa-twitter"></i> X / Twitter</span>
        <span class="platform-chip"><i class="fa-brands fa-facebook"></i> Facebook</span>
        <span class="platform-chip"><i class="fa-brands fa-vimeo"></i> Vimeo</span>
        <span class="platform-chip"><i class="fa-brands fa-reddit"></i> Reddit</span>
        <span class="platform-chip"><i class="fa-solid fa-circle-dot"></i> ve daha fazlası</span>
    </div>

    <div class="tool-box">
        <!-- URL -->
        <div class="form-group">
            <label class="form-label" for="videoUrl">Video Bağlantısı</label>
            <input class="url-input" type="url" id="videoUrl"
                   placeholder="https://www.youtube.com/watch?v=…">
        </div>

        <hr class="divider">

        <!-- Options -->
        <div class="two-col">
            <div class="form-group">
                <label class="form-label" for="dlMode">İndirme Modu</label>
                <select id="dlMode">
                    <option value="auto">Otomatik</option>
                    <option value="audio">Sadece Ses (MP3)</option>
                    <option value="mute">Sessiz Video</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="videoQuality">Kalite</label>
                <select id="videoQuality">
                    <option value="max">En Yüksek</option>
                    <option value="4320">8K / 4320p</option>
                    <option value="2160">4K / 2160p</option>
                    <option value="1440">1440p</option>
                    <option value="1080" selected>1080p</option>
                    <option value="720">720p</option>
                    <option value="480">480p</option>
                    <option value="360">360p</option>
                    <option value="240">240p</option>
                    <option value="144">144p</option>
                </select>
            </div>
        </div>

        <div class="form-group" id="audioFormatGroup">
            <label class="form-label" for="audioFormat">Ses Formatı</label>
            <select id="audioFormat">
                <option value="mp3">MP3</option>
                <option value="ogg">OGG</option>
                <option value="wav">WAV</option>
                <option value="opus">Opus</option>
                <option value="best">Orijinal Kalite</option>
            </select>
        </div>

        <button class="btn-primary" id="fetchBtn">
            <i class="fa-solid fa-download"></i> İndir
        </button>

        <!-- Result -->
        <div class="result-area" id="resultArea">
            <div class="status-msg loading" id="statusMsg">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <span id="statusText">Bağlantı işleniyor…</span>
            </div>
            <div id="downloadOptions"></div>
        </div>

        <p class="notice">
            Bu araç <a href="https://cobalt.tools" target="_blank" rel="noopener" style="color:var(--accent);">cobalt.tools</a>
            altyapısını kullanır. Telif hakkına saygı gösterin.
        </p>
    </div>
</div>

<script>
    // ── Hamburger ───────────────────────────────────────────
    document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('menuToggle').classList.toggle('active');
        document.getElementById('navMenu').classList.toggle('active');
    });

    // ── Hide/show audio format based on mode ────────────────
    document.getElementById('dlMode').addEventListener('change', (e) => {
        document.getElementById('audioFormatGroup').style.display =
            e.target.value === 'audio' ? '' : 'none';
    });
    // Initial state
    document.getElementById('audioFormatGroup').style.display = 'none';

    // ── Fetch ────────────────────────────────────────────────
    document.getElementById('fetchBtn').addEventListener('click', startDownload);

    async function startDownload() {
        const url = document.getElementById('videoUrl').value.trim();
        if (!url) { alert('Lütfen bir video bağlantısı girin.'); return; }

        const mode    = document.getElementById('dlMode').value;
        const quality = document.getElementById('videoQuality').value;
        const aFmt    = document.getElementById('audioFormat').value;

        const resultArea = document.getElementById('resultArea');
        const statusMsg  = document.getElementById('statusMsg');
        const statusText = document.getElementById('statusText');
        const dlOptions  = document.getElementById('downloadOptions');
        const fetchBtn   = document.getElementById('fetchBtn');

        // Show loading
        resultArea.classList.add('show');
        statusMsg.className = 'status-msg loading';
        statusMsg.style.display = 'flex';
        statusText.textContent = 'Bağlantı işleniyor…';
        dlOptions.innerHTML = '';
        fetchBtn.disabled = true;

        try {
            const body = {
                url: url,
                videoQuality: quality === 'max' ? undefined : quality,
                downloadMode: mode,
                audioFormat: mode === 'audio' ? aFmt : undefined,
                filenameStyle: 'pretty',
                youtubeVideoCodec: 'h264'
            };
            // Remove undefined keys
            Object.keys(body).forEach(k => body[k] === undefined && delete body[k]);

            const res = await fetch('https://api.cobalt.tools/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                throw new Error(`Sunucu hatası: ${res.status}`);
            }

            const data = await res.json();
            statusMsg.style.display = 'none';

            if (data.status === 'error') {
                showError(data.error?.code || 'Bilinmeyen hata');
                return;
            }

            if (data.status === 'redirect' || data.status === 'tunnel') {
                addDownloadOption({
                    label: data.filename || 'İndir',
                    sublabel: data.status === 'tunnel' ? 'cobalt tüneli' : 'Doğrudan bağlantı',
                    url: data.url,
                    filename: data.filename || 'video'
                });
            } else if (data.status === 'picker') {
                data.picker.forEach((item, i) => {
                    addDownloadOption({
                        label: item.type === 'photo' ? `Fotoğraf ${i + 1}` : `Video ${i + 1}`,
                        sublabel: item.type || 'media',
                        url: item.url,
                        filename: `item_${i + 1}`
                    });
                });
            } else {
                showError('Desteklenmeyen yanıt. Bağlantıyı kontrol edin.');
            }
        } catch (err) {
            showError(err.message || 'Bir hata oluştu.');
        } finally {
            fetchBtn.disabled = false;
        }
    }

    function addDownloadOption({ label, sublabel, url, filename }) {
        const el = document.createElement('div');
        el.className = 'download-option';
        el.innerHTML = `
            <div class="info">
                <span class="label"><i class="fa-solid fa-file-video" style="color:var(--accent);margin-right:0.4rem;"></i>${escHtml(label)}</span>
                <span class="sublabel">${escHtml(sublabel)}</span>
            </div>
            <button class="btn-dl">
                <i class="fa-solid fa-download"></i> İndir
            </button>
        `;
        el.querySelector('.btn-dl').addEventListener('click', () => {
            // Open in new tab; browser handles download based on Content-Disposition
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.click();
        });
        document.getElementById('downloadOptions').appendChild(el);
    }

    function showError(msg) {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.className = 'status-msg error';
        statusMsg.style.display = 'flex';
        document.getElementById('statusText').textContent = msg;
    }

    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
